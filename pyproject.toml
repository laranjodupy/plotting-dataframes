
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "plotting-dataframes-laranjodupy"
version = "0.1.0"
description = "A simple tool for easily creating charts from Pandas Dataframes."
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "laranjodupy" }
]

dependencies = [
    "matplotlib",
    "pandas"
]


[tool.setuptools.packages.find]
where = ["src"]

